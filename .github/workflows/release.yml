name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build container and verify test suite
        run: |
          podman build -t mudpie:ci .
          podman run --rm mudpie:ci npm test

      - name: Build packages inside container
        run: |
          mkdir -p dist
          podman run --rm -v ${{ github.workspace }}/dist:/app/dist:Z mudpie:ci node scripts/build.js

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.xpi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
